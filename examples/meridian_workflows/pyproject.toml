[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-workflows"
version = "0.1.0"
description = "Runnable, staged Python versions of the Meridian demo notebooks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["google-meridian[schema]>=2.1.0,<3"]

[project.optional-dependencies]
calibration = ["google-meridian[geox]>=2.1.0,<3"]
tracking = ["google-meridian[mlflow]>=2.1.0,<3"]
scenario = ["google-meridian[scenarioplanner]>=2.1.0,<3"]
all = ["google-meridian[geox,mlflow,scenarioplanner]>=2.1.0,<3"]
dev = ["pytest>=8", "pyink"]

[project.scripts]
meridian-demo = "meridian_workflows.cli:main"

[tool.setuptools.packages.find]
include = ["meridian_workflows*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyink]
line-length = 80
target-version = ["py310"]
pyink-indentation = 2
pyink-use-majority-quotes = true
